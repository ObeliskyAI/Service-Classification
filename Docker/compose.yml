services:
  fastapi:
    build:
      context: ..
      dockerfile: Docker/Dockerfile

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]

    container_name: fastapi
    ports:
      - "8000:8000"
    volumes:
      - fastapi_data:/app/assets
      - ../src:/app/src
    restart: always
    env_file:
      - ./.env.app

volumes:
  fastapi_data:
